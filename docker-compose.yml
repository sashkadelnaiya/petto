services:
  backend:
    build: ./backend
    container_name: petto-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./database.sqlite:/app/database.sqlite
      - ./backend/uploads:/app/uploads
    environment:
      - PORT=3000
      - DB_PATH=/app/database.sqlite
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-access_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-refresh_secret}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
    container_name: petto-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - BACKEND_URL=http://backend:3000
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
    depends_on:
      - backend


